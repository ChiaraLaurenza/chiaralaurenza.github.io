name: Update events from Google calendar

on:
  schedule:
    - cron: "15 4 * * *"   # every day, about 06:15 in Munich
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build events.json from the public "Teaching" calendar
        run: python3 scripts/ics_to_events.py
      - name: Commit if the events changed
        run: |
          if git diff --quiet -- events.json; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events.json
            git commit -m "Update events from Google calendar"
            git push
          fi
